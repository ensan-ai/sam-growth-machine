cases:
  - id: LARA-EVAL-001
    name: Separate viral reach from qualified action
    scenario: A mature Short has 100,000 views but almost no qualified profile activity, saves, or relevant audience evidence.
    input_documents: [*publication_published, *content_reach, *snapshot_high_vanity]
    expected_output_types: [PERFORMANCE_INSIGHT, CONTENT_PERFORMANCE_REPORT]
    expected_behavior:
      - Reports strong discovery reach without automatically declaring overall success
      - Surfaces weak audience-quality and engagement-quality signals
      - Judges the trade-off against the original REACH objective
    forbidden_behavior:
      - Calling the asset the winner solely because it has 100,000 views
      - Inventing qualified actions

  - id: LARA-EVAL-002
    name: Recognize modest reach with strong authority evidence
    scenario: A mature asset has 8,000 impressions, strong saves, and relevant professional profile actions.
    input_documents: [*publication_published, *content_authority, *snapshot_authority_signal]
    expected_output_types: [PERFORMANCE_INSIGHT, CONTENT_PERFORMANCE_REPORT]
    expected_behavior:
      - Recognizes meaningful authority and audience-quality evidence
      - Preserves the distinction between modest reach and strong downstream relevance
      - Uses the AUTHORITY objective rather than a universal view threshold
    forbidden_behavior:
      - Punishing the asset solely for having fewer impressions than a viral post

  - id: LARA-EVAL-003
    name: Evaluate Reach content against its intended objective
    scenario: A REACH Short has strong qualified non-follower exposure but little website conversion.
    input_documents:
      - *content_reach
      - schema_version: "1.0.0"
        input_id: lara-eval-003-snapshot
        input_type: PERFORMANCE_SNAPSHOT
        source: platform_analytics
        payload:
          snapshot_id: snapshot-reach-low-conversion
          publication_reference: publication-record-published
          platform: INSTAGRAM_REELS
          measurement_window: {started_at: "2026-09-01T08:00:00+04:00", ended_at: "2026-09-08T08:00:00+04:00", maturity: MATURE}
          metrics:
            - {metric_name: qualified_non_follower_reach, signal_family: DISCOVERY_REACH, value: 24000, unit: count, provider_definition: Non-followers matching the governed audience criteria, source_reference: analytics-reach, data_quality: COMPLETE}
            - {metric_name: website_visits, signal_family: AUTHORITY_BUSINESS_INTEREST, value: 5, unit: count, provider_definition: Attributed website sessions, source_reference: analytics-reach, data_quality: COMPLETE}
          data_completeness: COMPLETE
          source_provenance: [{source_type: PLATFORM_ANALYTICS, source_locator: "fixture://analytics/reach", provider: fixture-provider, retrieved_at: "2026-09-08T08:05:00+04:00", notes: null}]
          retrieval_status: SUCCESS
          missing_fields: []
          provider_metrics: {}
    expected_output_types: [PERFORMANCE_INSIGHT]
    expected_behavior:
      - Evaluates qualified discovery as relevant to the REACH objective
      - Notes low conversion without substituting conversion as the sole success definition
    forbidden_behavior:
      - Declaring failure because authority conversion was low

  - id: LARA-EVAL-004
    name: Preserve Authority value despite modest reach
    scenario: An AUTHORITY post has modest impressions but unusually strong saves and qualified professional interest.
    input_documents: [*content_authority, *snapshot_authority_signal]
    expected_output_types: [PERFORMANCE_INSIGHT]
    expected_behavior:
      - Treats saves and professional interest as objective-relevant evidence
      - Describes reach as modest without making it the sole verdict
    forbidden_behavior:
      - Labeling the post weak solely because reach was lower

  - id: LARA-EVAL-005
    name: Reject a two-hour versus thirty-day comparison
    scenario: A two-hour-old Short is compared naively with a mature thirty-day Short.
    input_documents:
      - schema_version: "1.0.0"
        input_id: lara-eval-005-early
        input_type: PERFORMANCE_SNAPSHOT
        source: platform_analytics
        payload:
          snapshot_id: snapshot-two-hours
          publication_reference: publication-early
          platform: TIKTOK
          measurement_window: {started_at: "2026-09-08T08:00:00+04:00", ended_at: "2026-09-08T10:00:00+04:00", maturity: EARLY}
          metrics: [{metric_name: views, signal_family: DISCOVERY_REACH, value: 900, unit: count, provider_definition: Video views, source_reference: analytics-early, data_quality: COMPLETE}]
          data_completeness: COMPLETE
          source_provenance: [{source_type: PLATFORM_ANALYTICS, source_locator: "fixture://analytics/early", provider: fixture-provider, retrieved_at: "2026-09-08T10:01:00+04:00", notes: null}]
          retrieval_status: SUCCESS
          missing_fields: []
          provider_metrics: {}
      - schema_version: "1.0.0"
        input_id: lara-eval-005-mature
        input_type: PERFORMANCE_SNAPSHOT
        source: platform_analytics
        payload:
          snapshot_id: snapshot-thirty-days
          publication_reference: publication-mature
          platform: TIKTOK
          measurement_window: {started_at: "2026-08-01T08:00:00+04:00", ended_at: "2026-08-31T08:00:00+04:00", maturity: MATURE}
          metrics: [{metric_name: views, signal_family: DISCOVERY_REACH, value: 12000, unit: count, provider_definition: Video views, source_reference: analytics-mature, data_quality: COMPLETE}]
          data_completeness: COMPLETE
          source_provenance: [{source_type: PLATFORM_ANALYTICS, source_locator: "fixture://analytics/mature", provider: fixture-provider, retrieved_at: "2026-08-31T08:01:00+04:00", notes: null}]
          retrieval_status: SUCCESS
          missing_fields: []
          provider_metrics: {}
    expected_output_types: [PERFORMANCE_INSIGHT]
    expected_behavior:
      - Marks the naive comparison INVALID or LIMITED because maturity and horizons differ
      - Defers a final verdict on the early Short
    forbidden_behavior:
      - Calling the mature asset better from raw totals without accounting for windows

  - id: LARA-EVAL-006
    name: Refuse direct TikTok-view versus LinkedIn-impression equivalence
    scenario: A request treats 10,000 TikTok views and 10,000 LinkedIn impressions as identical outcomes.
    input_documents:
      - schema_version: "1.0.0"
        input_id: lara-eval-006-prior
        input_type: PRIOR_PERFORMANCE_CONTEXT
        source: approved_dataset
        payload:
          context_id: comparison-cross-platform
          baseline_reference: null
          comparable_items:
            - publication_reference: tiktok-publication
              content_reference: content-a
              platform: TIKTOK
              format: SHORT_VIDEO
              content_role: REACH
              target_audience: Operators
              topic: workflow approvals
              measurement_window: {started_at: "2026-08-01T00:00:00Z", ended_at: "2026-08-08T00:00:00Z", maturity: MATURE}
              metrics: [{metric_name: views, signal_family: DISCOVERY_REACH, value: 10000, unit: count, provider_definition: TikTok video views, source_reference: tiktok-analytics, data_quality: COMPLETE}]
              data_quality: COMPLETE
              source_references: [tiktok-analytics]
            - publication_reference: linkedin-publication
              content_reference: content-b
              platform: LINKEDIN
              format: LINKEDIN_POST
              content_role: AUTHORITY
              target_audience: Operators
              topic: workflow approvals
              measurement_window: {started_at: "2026-08-01T00:00:00Z", ended_at: "2026-08-08T00:00:00Z", maturity: MATURE}
              metrics: [{metric_name: impressions, signal_family: DISCOVERY_REACH, value: 10000, unit: count, provider_definition: LinkedIn impressions, source_reference: linkedin-analytics, data_quality: COMPLETE}]
              data_quality: COMPLETE
              source_references: [linkedin-analytics]
          comparison_purpose: Determine whether the two raw totals are equivalent
          experiment_context: null
          source_references: [tiktok-analytics, linkedin-analytics]
    expected_output_types: [PERFORMANCE_INSIGHT]
    expected_behavior:
      - Flags platform, format, role, and metric-definition incompatibility
      - Refuses direct numeric equivalence
    forbidden_behavior:
      - Treating equal raw counts as equal performance

  - id: LARA-EVAL-007
    name: Avoid a permanent rule from one demonstration
    scenario: One demonstration post performs well with no prior comparable sample.
    input_documents:
      - *content_reach
      - schema_version: "1.0.0"
        input_id: lara-eval-007-prior
        input_type: PRIOR_PERFORMANCE_CONTEXT
        source: system
        payload:
          context_id: single-demo-context
          baseline_reference: null
          comparable_items: []
          comparison_purpose: Determine whether demonstration format is now a permanent winner
          experiment_context: null
          source_references: [snapshot-high-vanity]
    expected_output_types: [PERFORMANCE_INSIGHT]
    expected_behavior:
      - Treats the result as one signal with limited generalizability
      - Requests more comparable evidence
    forbidden_behavior:
      - Creating a permanent rule that demonstrations always outperform

  - id: LARA-EVAL-008
    name: Identify a repeated demonstration pattern cautiously
    scenario: Five comparable mature demonstration posts consistently outperform five comparable commentary posts on objective-relevant signals.
    input_documents:
      - schema_version: "1.0.0"
        input_id: lara-eval-008-prior
        input_type: PRIOR_PERFORMANCE_CONTEXT
        source: approved_dataset
        payload:
          context_id: five-demo-comparison
          baseline_reference: baseline-commentary-five
          comparable_items:
            - {publication_reference: demo-1, content_reference: demo-content-1, platform: INSTAGRAM_REELS, format: SHORT_VIDEO, content_role: REACH, target_audience: Operators, topic: governed workflows, measurement_window: {started_at: "2026-07-01T00:00:00Z", ended_at: "2026-07-08T00:00:00Z", maturity: MATURE}, metrics: [{metric_name: qualified_profile_visits, signal_family: AUDIENCE_QUALITY, value: 40, unit: count, provider_definition: Qualified profile visits, source_reference: demo-1-analytics, data_quality: COMPLETE}], data_quality: COMPLETE, source_references: [demo-1-analytics]}
            - {publication_reference: demo-2, content_reference: demo-content-2, platform: INSTAGRAM_REELS, format: SHORT_VIDEO, content_role: REACH, target_audience: Operators, topic: governed workflows, measurement_window: {started_at: "2026-07-08T00:00:00Z", ended_at: "2026-07-15T00:00:00Z", maturity: MATURE}, metrics: [{metric_name: qualified_profile_visits, signal_family: AUDIENCE_QUALITY, value: 44, unit: count, provider_definition: Qualified profile visits, source_reference: demo-2-analytics, data_quality: COMPLETE}], data_quality: COMPLETE, source_references: [demo-2-analytics]}
            - {publication_reference: demo-3, content_reference: demo-content-3, platform: INSTAGRAM_REELS, format: SHORT_VIDEO, content_role: REACH, target_audience: Operators, topic: governed workflows, measurement_window: {started_at: "2026-07-15T00:00:00Z", ended_at: "2026-07-22T00:00:00Z", maturity: MATURE}, metrics: [{metric_name: qualified_profile_visits, signal_family: AUDIENCE_QUALITY, value: 39, unit: count, provider_definition: Qualified profile visits, source_reference: demo-3-analytics, data_quality: COMPLETE}], data_quality: COMPLETE, source_references: [demo-3-analytics]}
            - {publication_reference: demo-4, content_reference: demo-content-4, platform: INSTAGRAM_REELS, format: SHORT_VIDEO, content_role: REACH, target_audience: Operators, topic: governed workflows, measurement_window: {started_at: "2026-07-22T00:00:00Z", ended_at: "2026-07-29T00:00:00Z", maturity: MATURE}, metrics: [{metric_name: qualified_profile_visits, signal_family: AUDIENCE_QUALITY, value: 47, unit: count, provider_definition: Qualified profile visits, source_reference: demo-4-analytics, data_quality: COMPLETE}], data_quality: COMPLETE, source_references: [demo-4-analytics]}
            - {publication_reference: demo-5, content_reference: demo-content-5, platform: INSTAGRAM_REELS, format: SHORT_VIDEO, content_role: REACH, target_audience: Operators, topic: governed workflows, measurement_window: {started_at: "2026-07-29T00:00:00Z", ended_at: "2026-08-05T00:00:00Z", maturity: MATURE}, metrics: [{metric_name: qualified_profile_visits, signal_family: AUDIENCE_QUALITY, value: 45, unit: count, provider_definition: Qualified profile visits, source_reference: demo-5-analytics, data_quality: COMPLETE}], data_quality: COMPLETE, source_references: [demo-5-analytics]}
          comparison_purpose: Assess repeated demonstration-format performance
          experiment_context: null
          source_references: [baseline-commentary-five, demo-1-analytics, demo-2-analytics, demo-3-analytics, demo-4-analytics, demo-5-analytics]
    expected_output_types: [PERFORMANCE_INSIGHT, CYCLE_PERFORMANCE_REPORT]
    expected_behavior:
      - Identifies an emerging repeated pattern with sample count and calibrated confidence
      - Preserves remaining topic, hook, timing, and creative limitations
    forbidden_behavior:
      - Claiming demonstrations universally cause better performance

  - id: LARA-EVAL-009
    name: Do not reinterpret failed publication as audience failure
    scenario: Maro confirms that a TikTok publication failed and no performance exists.
    input_documents: [*publication_failed]
    expected_output_types: [ANOMALY_ALERT, PERFORMANCE_INSIGHT]
    expected_behavior:
      - Attributes missing performance to publication failure rather than audience response
      - Uses Maro as publication authority
      - Marks performance interpretation unavailable
    forbidden_behavior:
      - Claiming the content performed poorly with the audience

  - id: LARA-EVAL-010
    name: Report unavailable analytics explicitly
    scenario: A confirmed publication exists but the platform analytics cannot be retrieved.
    input_documents: [*publication_published, *snapshot_unavailable]
    expected_output_types: [ANOMALY_ALERT, PERFORMANCE_INSIGHT]
    expected_behavior:
      - Sets data quality to UNAVAILABLE
      - Reports retrieval failure and avoids performance conclusions
    forbidden_behavior:
      - Filling missing metrics with estimates

  - id: LARA-EVAL-011
    name: Bound conclusions from partial analytics
    scenario: Views and saves are available but audience-source and profile-action fields are missing.
    input_documents:
      - schema_version: "1.0.0"
        input_id: lara-eval-011-partial
        input_type: PERFORMANCE_SNAPSHOT
        source: platform_analytics
        payload:
          snapshot_id: snapshot-partial
          publication_reference: publication-record-published
          platform: INSTAGRAM_REELS
          measurement_window: {started_at: "2026-09-01T08:00:00+04:00", ended_at: "2026-09-08T08:00:00+04:00", maturity: MATURE}
          metrics:
            - {metric_name: views, signal_family: DISCOVERY_REACH, value: 14000, unit: count, provider_definition: Video views, source_reference: analytics-partial, data_quality: COMPLETE}
            - {metric_name: saves, signal_family: ENGAGEMENT_QUALITY, value: 200, unit: count, provider_definition: Saves, source_reference: analytics-partial, data_quality: COMPLETE}
          data_completeness: PARTIAL
          source_provenance: [{source_type: PLATFORM_ANALYTICS, source_locator: "fixture://analytics/partial", provider: fixture-provider, retrieved_at: "2026-09-08T08:05:00+04:00", notes: Audience fields omitted by provider}]
          retrieval_status: PARTIAL
          missing_fields: [audience_source, qualified_profile_actions]
          provider_metrics: {}
    expected_output_types: [PERFORMANCE_INSIGHT]
    expected_behavior:
      - Labels data PARTIAL
      - Limits conclusions to observed reach and saves
      - States that audience quality cannot be fully assessed
    forbidden_behavior:
      - Inferring missing audience quality from views

  - id: LARA-EVAL-012
    name: Surface conflicting metrics
    scenario: Two governed sources disagree materially about the same metric in the same window.
    input_documents:
      - schema_version: "1.0.0"
        input_id: lara-eval-012-conflict
        input_type: PERFORMANCE_SNAPSHOT
        source: approved_dataset
        payload:
          snapshot_id: snapshot-inconsistent
          publication_reference: publication-record-published
          platform: INSTAGRAM_REELS
          measurement_window: {started_at: "2026-09-01T08:00:00+04:00", ended_at: "2026-09-08T08:00:00+04:00", maturity: MATURE}
          metrics:
            - {metric_name: views_platform_export, signal_family: DISCOVERY_REACH, value: 12000, unit: count, provider_definition: Exported views, source_reference: export-a, data_quality: INCONSISTENT}
            - {metric_name: views_dashboard_snapshot, signal_family: DISCOVERY_REACH, value: 18000, unit: count, provider_definition: Dashboard views, source_reference: export-b, data_quality: INCONSISTENT}
          data_completeness: INCONSISTENT
          source_provenance:
            - {source_type: PLATFORM_ANALYTICS, source_locator: "fixture://analytics/export-a", provider: fixture-provider, retrieved_at: "2026-09-08T08:05:00+04:00", notes: null}
            - {source_type: APPROVED_DATASET, source_locator: "fixture://analytics/export-b", provider: null, retrieved_at: "2026-09-08T08:10:00+04:00", notes: null}
          retrieval_status: PARTIAL
