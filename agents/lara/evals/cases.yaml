            - {publication_reference: experiment-b, content_reference: condition-b, platform: LINKEDIN, format: LINKEDIN_POST, content_role: AUTHORITY, target_audience: Operators, topic: approval boundaries, measurement_window: {started_at: "2026-08-08T00:00:00Z", ended_at: "2026-08-15T00:00:00Z", maturity: MATURE}, metrics: [{metric_name: save_rate, signal_family: ENGAGEMENT_QUALITY, value: 0.03, unit: ratio, provider_definition: Saves divided by impressions, source_reference: experiment-b-data, data_quality: COMPLETE}], data_quality: COMPLETE, source_references: [experiment-b-data]}
