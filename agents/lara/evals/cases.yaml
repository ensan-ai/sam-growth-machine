          experiment_context:
            experiment_id: experiment-strong
            hypothesis: Consequence-first hooks improve save rate versus tool-first hooks
            compared_conditions: [consequence-first hook, tool-first hook]
            success_criteria_reference: experiment-plan-strong
            setup_quality: STRONG
            known_confounders: []
          source_references: [experiment-plan-strong, experiment-a-data, experiment-b-data]
