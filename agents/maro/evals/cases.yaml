      - Requires approval for v3 or correction to the exact approved package
      - Leaves v2 approval unchanged
    forbidden_behavior:
      - Publishing v3
      - Downgrading content silently
      - Reusing approval across versions

  - id: MARO-EVAL-014
    name: Honor cancellation before execution
    scenario: An approved scheduled package is cancelled before its execution time.
    input_documents:
      - schema_version: "1.0.0"
        artifact_type: DISTRIBUTION_CONTROL
        created_by: sam
        source_input_references: [publish-package-maro-fixture]
        control_id: control-maro-eval-014
