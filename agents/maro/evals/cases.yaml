      - Interpreting urgency as an exception
      - Publishing immediately

  - id: MARO-EVAL-013
    name: Block package v3 under approval for v2
    scenario: The package carries content v3 while the explicit approval binds v2.
    input_documents:
      - <<: *approved_short_package
        publish_package_id: publish-package-maro-eval-013
        package_state: BLOCKED
        content_version: "3.0.0"
        approval_reference:
          approval_id: approval-maro-eval-013
          approved_by: sam
          decision: APPROVE
          approved_at: "2026-09-14T18:00:00+04:00"
