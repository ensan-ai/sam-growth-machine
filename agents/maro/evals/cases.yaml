      - Downgrading confirmed publication solely because the ID is absent
      - Omitting the receipt

  - id: MARO-EVAL-016
    name: Classify a rate limit as transient
    scenario: A platform rejects the current attempt because of a temporary rate limit.
    input_documents:
      - <<: *confirmed_instagram_update
        update_id: update-maro-eval-016
        event_type: RATE_LIMITED
        platform_content_id: null
        platform_url: null
        error_category: TRANSIENT
        error_summary: Temporary platform rate limit.
        retry_after: "2026-09-15T09:15:00+04:00"
        confirmation_evidence: [platform rate-limit response]
    expected_output_types: [PUBLICATION_RECEIPT, DISTRIBUTION_RESULT]
    expected_behavior:
      - Classifies TRANSIENT and records the retry-after time
      - Applies only a future approved bounded retry policy
      - Preserves approval and idempotency identity
    forbidden_behavior:
      - Retrying forever
      - Creating a new idempotency key
      - Hiding the failed attempt

