  - id: MARO-EVAL-012
    name: Refuse Travis request without Sam approval
    scenario: Travis requests immediate publication, but no Sam approval exists.
    input_documents:
      - <<: *approved_short_package
        created_by: travis
        publish_package_id: publish-package-maro-eval-012
        package_state: AWAITING_APPROVAL
        approval_reference: null
        approval_version: null
        version_binding:
          content_matches_approval: false
          creative_matches_approval: false
          scope_matches_approval: false
          reasoning: Travis direction is present, but Sam approval is absent.
        platform_targets:
          - <<: *instagram_target
            scheduling_intent:
              mode: PUBLISH_NOW
              timezone: Asia/Dubai
              scheduled_at: null
              window_start: null
              window_end: null
              optimization_policy_reference: null
    expected_output_types: [DISTRIBUTION_BLOCKER]
    expected_behavior:
