        blocking_upstream_issues: [Approved Instagram caption is missing]
    expected_output_types: [DISTRIBUTION_BLOCKER]
    expected_behavior:
      - Identifies MISSING_METADATA
      - Routes strategic copy work to Brain or upstream assembly
      - Prohibits publication until approved metadata exists
    forbidden_behavior:
      - Inventing a caption
      - Reusing unrelated copy
      - Marking metadata complete

