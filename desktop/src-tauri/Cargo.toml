[package]
name = "sam-neural-core"
version = "0.1.0"
description = "Local-first SAM Growth Machine mission control"
authors = ["Sam"]
edition = "2021"

[lib]
name = "sam_neural_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.5", features = [], optional = true }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.8", features = [], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
